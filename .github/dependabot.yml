# Dependabot configuration: security updates only, grouped by ecosystem family.
#
# Why this shape (replaces the one-entry-per-example layout from #844):
# one entry per example meant one pull request per example with an open advisory. With
# 580 open alerts across 32 directories that is ~25 concurrent pull requests at steady
# state, each re-opened weekly, which is how the backlog reached 53. This file keeps
# every guarantee #844 added (security updates only, `security` group, `chore`/`ci`
# prefix that Commit Lint accepts, every manifest directory claimed) but claims the
# directories of a *family* of examples in one entry, so one weekly run opens at most
# one pull request per family: at most 12, and 9 with today's alerts.
#
# The trade-off #844 recorded still holds inside a family: one bad bump blocks the
# family's other fixes until someone fixes it. The families are drawn so that examples
# which break the same way share a pull request (the FastAPI/Starlette pins, the
# Tailwind/Vite front-end stack, the Express servers), and so that the one example
# with 163 alerts (sls/nestjs) cannot hold anyone else's fixes hostage.
#
# Directories stay spelled out, not globbed: Dependabot rejects several entries for one
# ecosystem when it cannot prove their directories do not overlap, and it cannot prove
# that for globs. A new example needs its directories added to one entry below;
# .github/scripts/check-example-config.sh enforces that from Verify Examples.
#
# `open-pull-requests-limit: 0` disables version updates and leaves security updates
# on. Security updates are exempt from the limit.
version: 2
updates:
  # --- npm: front-end frameworks (Next.js, Remix, SvelteKit, Bun) ---------------------
  - package-ecosystem: npm
    directories:
      - "/examples/bun-graphql-streaming-zip/app"
      - "/examples/bun-graphql-zip/app"
      - "/examples/nextjs/app"
      - "/examples/nextjs-response-streaming"
      - "/examples/nextjs-zip/app"
      - "/examples/remix/remix-app"
      - "/examples/remix-zip/remix-app"
      - "/examples/sveltekit-ssr-zip/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- npm: Express and Hono servers, and the Datadog CDK apps -----------------------
  - package-ecosystem: npm
    directories:
      - "/examples/datadog/expressjs-streaming/cdk"
      - "/examples/datadog/expressjs-streaming/lambda-asset/src"
      - "/examples/datadog/expressjs/cdk"
      - "/examples/datadog/expressjs/lambda-asset/src"
      - "/examples/datadog/flask/cdk"
      - "/examples/datadog-zip/expressjs/cdk"
      - "/examples/datadog-zip/expressjs/lambda-asset/src"
      - "/examples/expressjs/app/src"
      - "/examples/expressjs-zip/hello-world"
      - "/examples/hono-zip/app"
      - "/examples/sqs-expressjs/app/src"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- npm: Serverless Framework / NestJS (pnpm, 163 open alerts on its own) ---------
  - package-ecosystem: npm
    directories: ["/examples/sls/nestjs"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- pip: Starlette-based apps (FastAPI, FastHTML, FastMCP, Bedrock agent) ---------
  - package-ecosystem: pip
    directories:
      - "/examples/bedrock-agent-fastapi/app"
      - "/examples/bedrock-agent-fastapi-zip/app"
      - "/examples/fastapi/app"
      - "/examples/fastapi-backend-only-response-streaming/app"
      - "/examples/fastapi-background-tasks/app"
      - "/examples/fastapi-response-streaming/app"
      - "/examples/fastapi-response-streaming-lmi/app"
      - "/examples/fastapi-response-streaming-zip/app"
      - "/examples/fastapi-snapstart/app"
      - "/examples/fastapi-snapstart-zip/app"
      - "/examples/fastapi-zip/app"
      - "/examples/fastapi-zip/tests"
      - "/examples/fasthtml/app"
      - "/examples/fasthtml-response-streaming/app"
      - "/examples/fasthtml-response-streaming-zip/app"
      - "/examples/fasthtml-zip/app"
      - "/examples/fastmcp/my_mcp_server"
      - "/examples/fastmcp-zip/my_mcp_server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- pip: Flask apps ----------------------------------------------------------------
  - package-ecosystem: pip
    directories:
      - "/examples/datadog/flask/lambda-asset/src"
      - "/examples/flask/app"
      - "/examples/flask-zip/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- gomod ----------------------------------------------------------------------------
  - package-ecosystem: gomod
    directories:
      - "/examples/gin/app"
      - "/examples/gin-zip/app"
      - "/examples/go-http-zip"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- maven ----------------------------------------------------------------------------
  - package-ecosystem: maven
    directories:
      - "/examples/javalin-zip/app"
      - "/examples/springboot/app"
      - "/examples/springboot-response-streaming-zip/app"
      - "/examples/springboot-zip/app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- nuget ----------------------------------------------------------------------------
  - package-ecosystem: nuget
    directories:
      - "/examples/aspnet-mvc/src"
      - "/examples/aspnet-mvc-zip/src"
      - "/examples/aspnet-webapi-zip/src"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- bundler --------------------------------------------------------------------------
  - package-ecosystem: bundler
    directories: ["/examples/sinatra/app/src"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- cargo: the two Rust examples (kept apart from the adapter's own crate) --------
  - package-ecosystem: cargo
    directories:
      - "/examples/rust-actix-web-zip/rust_app"
      - "/examples/rust-axum-zip/rust_app"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- cargo: the adapter itself. Unchanged from #844: security updates only, every
  # pull request reviewed and merged by hand; listed for the commit prefix.
  - package-ecosystem: cargo
    directories: ["/"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- github-actions: unchanged from #844 ------------------------------------------
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
