  # cargo, the adapter itself rather than an example. Listed for the commit message
  # only: the limit keeps version updates off, and dependabot-automerge.sh refuses
  # anything touching files outside examples/, so an advisory here still gets a hand
  # review — it just arrives with a header Commit Lint accepts. Pre-emptive: today's six
  # open rust alerts are all in examples/rust-*-zip, which the entries above cover.
  - package-ecosystem: cargo
    directories: ["/"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
    groups:
      adapter-cargo:
        applies-to: security-updates
        patterns: ["*"]

  # Not an example either, and also listed for the naming alone. Every workflow here pins
  # actions (actions/checkout@v4, Swatinem/rust-cache@v2, orhun/git-cliff-action@v4), so
  # an actions advisory would open a pull request titled "bump actions/... from X to Y" —
  # no conventional type, red Commit Lint, manual amend. With the limit at 0 this adds no
  # pull requests; it only names the ones an advisory would produce anyway. There are no
  # open actions alerts today, so this is pre-emptive.
  - package-ecosystem: github-actions
    directories: ["/"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
    groups:
      github-actions:
        applies-to: security-updates
        patterns: ["*"]
