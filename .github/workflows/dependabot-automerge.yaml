name: Dependabot Auto-merge

# Merges Dependabot pull requests that only touch example applications, once Verify
# Examples has actually verified them. The decision lives in
# .github/scripts/dependabot-automerge.sh; this file only decides which pull requests to
# offer it.
#
# Two triggers, deliberately:
#
#   workflow_run — the fast path. A pull request that is already green elsewhere merges
#     within seconds of its verification finishing.
#   schedule — the catch-all. Checks on a pull request settle in arbitrary order, so
#     Verify Examples can finish while Commit Lint or CodeQL is still running. With only
#     the first trigger, such a pull request was skipped and never reconsidered, because
#     nothing else re-triggers this workflow: Dependabot pushes a branch only when it
#     rebases or recreates it, so an idle pull request could wait indefinitely.
#
# Not `gh pr merge --auto`: auto-merge is gated on the repository's *required* status
# checks, and Verify Examples is path-filtered to examples/**, so requiring its result
# would never report on a source-only pull request and would block it forever.
#
# Requires no branch protection and no repository settings.
on:
  workflow_run:
    workflows: ["Verify Examples"]
    types:
      - completed
  schedule:
    # Hourly, off the hour to avoid the busiest minute.
    - cron: "17 * * * *"
  workflow_dispatch:

# Keyed per pull request, not one group for everything. Only one run per group may be
# pending, and a new arrival cancels the pending one — so with a single group, a burst of
# Verify Examples runs finishing together (the normal case, since Dependabot opens its
# security pull requests in batches) would cancel each other's queued fast-path runs
# until only the last survived, leaving the rest to the hourly sweep and filling the run
# history with cancellations that read like failures.
#
# The cost is that a sweep run and a fast-path run can now overlap on the same pull
# request. That is handled where it actually has to be: --match-head-commit plus the
# mergeStateStatus branch in dependabot-automerge.sh turn the loser into a skip with a
# reason rather than a red run.
concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.pull_requests[0].number || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required to list a run's jobs and to look a run up by head SHA. Declaring a
  # permissions block sets every scope not named here to none, so without this the
  # Actions API returns 403. Same reason commitlint-comment.yaml declares it.
  actions: read

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned to the default branch on purpose. This job holds a write token, so it
          # must never run a script from a pull request's head — the ref is not derived
          # from the event under any trigger.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Merge eligible Dependabot pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Empty for schedule and manual runs, which sweep every open Dependabot PR.
          TRIGGERED_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ -n "${TRIGGERED_PR:-}" ]]; then
            prs="$TRIGGERED_PR"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # A run with no associated pull request: a push to main, or a fork.
            echo "Triggering run has no pull request; nothing to do."
            exit 0
          else
            # One request covers the whole queue, so the sweep can drop the pull
            # requests that obviously cannot merge — conflicted, or a check red or
            # pending — before spending ~6 API calls each on them in the script. Only
            # CONFLICTING is excluded on mergeability, not "anything but MERGEABLE":
            # GitHub reports UNKNOWN while it recomputes, and dropping those could skip
            # a pull request forever. With
            # ~70 open Dependabot pull requests that is the difference between a cheap
            # hourly sweep and one that eats the token's hourly budget.
            prs=$(gh pr list --repo "$REPO" --author app/dependabot --state open \
              --limit 200 --json number,mergeable,statusCheckRollup -q '
                .[]
                | select(.mergeable != "CONFLICTING")
                | select([.statusCheckRollup[]?
                          | select([((.conclusion // .state // "PENDING") | ascii_upcase)]
                                   - ["SUCCESS", "SKIPPED", "NEUTRAL"] | length > 0)]
                         | length == 0)
                | .number')
          fi

          if [[ -z "$prs" ]]; then
            echo "No open Dependabot pull requests."
            exit 0
          fi

          # One bad pull request must not stop the sweep from considering the rest, so
          # collect the status instead of letting set -e abort the loop.
          rc=0
          for pr in $prs; do
            .github/scripts/dependabot-automerge.sh "$pr" || rc=1
          done
          exit $rc
