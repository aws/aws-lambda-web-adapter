AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  hono-zip

  Sample SAM Template for hono-zip

# More info about Globals: https://github.com/aws/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 10

Resources:
  HonoFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/aws/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: app/
      Handler: run.sh
      Runtime: nodejs22.x
      MemorySize: 512
      Architectures:
        - x86_64
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          # Listen on 8000 so the app doesn't collide with SAM's Runtime
          # Interface Emulator on 8080 during local testing.
          PORT: 8000
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:30
      Events:
        HttpEvents:
          Type: HttpApi

Outputs:
  HonoApi:
    Description: "API Gateway endpoint URL for Hono function"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/"
  HonoFunction:
    Description: "Hono Lambda Function ARN"
    Value: !GetAtt HonoFunction.Arn
  HonoFunctionIamRole:
    Description: "Implicit IAM Role created for Hono function"
    Value: !GetAtt HonoFunctionRole.Arn
